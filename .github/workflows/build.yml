name: Build PiTrezor Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Fix git protocol (https instead of git://)
        run: |
          git config --global url."https://git.yoctoproject.org/".insteadOf "git://git.yoctoproject.org/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://git.openembedded.org/".insteadOf "git://git.openembedded.org/"

      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Yocto dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc-multilib build-essential chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping locales liblz4-tool zstd python-is-python3 python3-jinja2 python3-git libegl1-mesa libsdl1.2-dev python3-subunit mesa-common-dev file
          sudo locale-gen en_US.UTF-8

      - name: Build image
        run: |
          # Инициализация окружения (создаст папку build и перейдет в нее)
          source poky/oe-init-build-env build
          
          # ВАЖНО: замените 'meta-pitrezor' на реальное имя вашей папки с рецептами!
          bitbake-layers add-layer ../meta-pitrezor
          
          # Запуск сборки
          bitbake pitrezor-image
          
          echo "✅ Build completed"

      - name: Prepare artifact
        run: |
          IMG_FILE=$(find build/tmp/deploy/images/raspberrypi0-wifi -name "*.img" -o -name "*.wic" -o -name "*.rpi-sdimg" 2>/dev/null | head -1)
          
          if [ -n "$IMG_FILE" ]; then
            echo "✅ Найден образ: $IMG_FILE"
            mkdir -p artifact
            cp "$IMG_FILE" artifact/
            cd artifact
            zip pitrezor-image.zip $(basename "$IMG_FILE")
          else
            echo "❌ Образ не найден, ищем что есть в папке deploy:"
            find build/tmp/deploy/images/ -type f | head -20
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitrezor-image
          path: artifact/*.zip
          retention-days: 7
